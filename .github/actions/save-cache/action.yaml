name: Save cache
inputs:
  key:
    required: true
    description: Primary key to the cache, should be retrieved from `cache-restore` composite action outputs.
  additional-paths:
    required: false

runs:
  using: "composite"
  steps:
    # Compare PR repository identity: this repository itself is a fork, so
    # head.repo.fork is true even for our own feature branches.
    # The fork guard is defense-in-depth for pull_request_target, which does have write access.
    - name: Save cache
      if: ${{ (github.event.pull_request.head.repo.full_name == github.repository || (github.event_name != 'pull_request' && github.event_name != 'pull_request_target')) }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0 (save)
      with:
        key: ${{ inputs.key }}
        path: |
          .cache
          .nx
          node_modules/.cache
          packages/*/node_modules/.cache
          ${{ inputs.additional-paths }}