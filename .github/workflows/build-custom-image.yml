name: Build and push custom image

# Builds the Twenty image (frontend + backend) from this fork and publishes
# it to GitHub Container Registry (GHCR). Hosts then just pull this image.
# Builds run on GitHub's runners, avoiding the ~8GB frontend build OOM you'd
# hit on a small VM.
#
# linux/amd64 only. Both cloud boxes are e2-standard-2, which is x86, and that
# is not incidental: on GCP the x86 E2 family costs roughly half what the ARM
# C4A family does for the same 2 vCPU / 8 GB. arm64 was here for the Apple
# Silicon staging Mac, which was retired on 2026-08-09; nothing pulls it now.
# The build still runs natively rather than under QEMU.
#
# If an arm64 host ever comes back, restore the matrix entry AND the platform
# list in the merge job's verify step, which asserts exactly what is published.
#
# Pull requests build only when they carry the `needs-staging` label, so
# opening a PR costs nothing until someone actually wants it on staging.

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch: {}

concurrency:
  group: release-image-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'needs-staging')
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.target.outputs.image }}
      sha: ${{ steps.target.outputs.sha }}
      tags: ${{ steps.tags.outputs.list }}
      existing-image: ${{ steps.existing.outputs.image }}
    steps:
      - name: Resolve target commit and image name
        id: target
        env:
          OWNER: ${{ github.repository_owner }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # GHCR rejects uppercase repository names and the organisation name
          # is mixed case, so it has to be folded here.
          owner_lower="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner_lower}/twenty" >> "$GITHUB_OUTPUT"
          # On pull_request, github.sha is the ephemeral merge commit. Nobody
          # can deploy that commit, so tag the branch head instead.
          echo "sha=${PR_HEAD_SHA:-$PUSH_SHA}" >> "$GITHUB_OUTPUT"

      - name: Reuse a previously certified artifact for this source SHA
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          records="$(gh api "repos/$REPO/deployments?environment=release-artifact&sha=$SHA&per_page=100")"
          id="$(jq -r '[.[] | select(.payload.kind == "release-artifact")] | first | .id // empty' <<<"$records")"
          if [ -n "$id" ]; then
            state="$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state')"
            if [ "$state" = success ] || [ "$state" = failure ] || [ "$state" = pending ]; then
              image="$(jq -r --argjson id "$id" '.[] | select(.id == $id) | .payload.image' <<<"$records")"
              [[ "$image" =~ ^ghcr.io/[a-z0-9/-]+@sha256:[0-9a-f]{64}$ ]]
              echo "image=$image" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Compute tags
        id: tags
        env:
          IMAGE: ${{ steps.target.outputs.image }}
          SHA: ${{ steps.target.outputs.sha }}
          IS_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          # :latest may only ever move on main. A branch build moving it would
          # silently change what an unpinned pull resolves to.
          {
            echo "list<<TAGS"
            echo "${IMAGE}:${SHA}"
            if [ "$IS_MAIN" = "true" ]; then
              echo "${IMAGE}:latest"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

  build:
    if: needs.prepare.outputs.existing-image == ''
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        # One entry, but still a matrix: the merge job below builds a manifest
        # list from whatever this produces, so adding a platform back is an
        # entry here rather than a restructure.
        #
        # Adding or removing a platform means changing this list AND the verify
        # step in the merge job, which checks exactly this list.
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Name this platform
        id: platform
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Each platform pushes an untagged image and reports its digest. Tags go
      # on the manifest list in the merge job, so a half-finished matrix never
      # leaves a tag pointing at a single architecture.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          # Without an explicit target, Buildx builds the last stage, which is
          # twenty-app-dev: an all-in-one image with Postgres and Redis inside
          # it. Its entrypoint initialises its own embedded database and exits
          # non-zero when that database has no workspace, so the server never
          # starts against an external one. `twenty` is the backend + frontend
          # image these deployments actually run.
          target: twenty
          labels: org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          # Layer cache lives in GHCR, not GitHub's Actions cache. The Actions
          # cache has a hard 10 GB per-repo limit shared with every other
          # workflow; two platforms of mode=max buildkit blobs kept it pinned at
          # ~9.8 GB, so layers were constantly evicted and "cached" builds were
          # cold more often than not (15 min instead of ~1). A registry cache
          # has no such limit and persists between runs. image-manifest is
          # required for GHCR to accept the cache artifact.
          cache-from: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ steps.platform.outputs.pair }}
          cache-to: type=registry,ref=${{ needs.prepare.outputs.image }}:buildcache-${{ steps.platform.outputs.pair }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: needs.prepare.outputs.existing-image == ''
    needs: [prepare, build]
    outputs:
      image: ${{ steps.release.outputs.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tag_args+=(--tag "$tag")
          done <<<"$TAGS"

          source_args=()
          for digest in *; do
            source_args+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create "${tag_args[@]}" "${source_args[@]}"

      # A tag that does not resolve on the architecture the boxes run is the
      # failure this job structure exists to prevent, so it is checked rather
      # than assumed. Keep this list in step with the build matrix.
      - name: Verify the expected platforms are published
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          platforms="$(
            docker buildx imagetools inspect --raw "${IMAGE}:${SHA}" |
              jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' |
              grep -v unknown | sort -u
          )"
          echo "$platforms"
          for required in linux/amd64; do
            printf '%s\n' "$platforms" | grep -qx "$required" ||
              { echo "::error::${IMAGE}:${SHA} is missing $required"; exit 1; }
          done

      - name: Record immutable image identity
        id: release
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE:$SHA" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"

  verify-release:
    if: always() && !cancelled() && needs.prepare.result == 'success' && (needs.merge.result == 'success' || needs.prepare.outputs.existing-image != '')
    needs: [prepare, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Record release verification attempt
        id: verification
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          IMAGE: ${{ needs.prepare.outputs.existing-image || needs.merge.outputs.image }}
          RELEASE_ENVIRONMENT: release-artifact
          RELEASE_RESULT: pending
        run: |
          export RELEASE_PAYLOAD="$(jq -nc --arg sha "$SHA" --arg image "$IMAGE" \
            '{kind:"release-artifact",sha:$sha,image:$image}')"
          node .github/scripts/release-record.mjs publish "$SHA"
      - name: Freeze declared baseline
        run: |
          bash deploy/migration-test.sh freeze --baseline deploy/.migration-tests/baseline \
            --image "$(jq -r .image deploy/migration-baseline.json)" \
            --source-sha "$(jq -r .source_sha deploy/migration-baseline.json)" \
            --logs deploy/.migration-tests/freeze
      - name: Test the release artifact
        env:
          IMAGE: ${{ needs.prepare.outputs.existing-image || needs.merge.outputs.image }}
        run: |
          bash deploy/migration-test.sh run --baseline deploy/.migration-tests/baseline \
            --image "$IMAGE" --preview --logs deploy/.migration-tests/release
      - name: Certify the tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          IMAGE: ${{ needs.prepare.outputs.existing-image || needs.merge.outputs.image }}
          RELEASE_ENVIRONMENT: release-artifact
        run: |
          export RELEASE_PAYLOAD="$(jq -nc --arg sha "$SHA" --arg image "$IMAGE" \
            --slurpfile result deploy/.migration-tests/release/result.json \
            '{kind:"release-artifact", sha:$sha, image:$image, rehearsal:$result[0]}')"
          node .github/scripts/release-record.mjs publish "$SHA"
      - name: Invalidate a failed release verification
        if: failure() && steps.verification.outputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_DEPLOYMENT_ID: ${{ steps.verification.outputs.deployment_id }}
          RELEASE_RESULT: failure
        run: node .github/scripts/release-record.mjs finish "$SHA"
      - name: Retain safe verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification
          path: deploy/.migration-tests/release/result.json
          if-no-files-found: error
