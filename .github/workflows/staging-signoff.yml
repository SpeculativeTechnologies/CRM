name: Record a staging check

# Records that a human exercised what is currently on staging, so that a
# database change can be promoted without the production owner reviewing it.
#
# Deploy to production reads the `staging-verified` ref this writes and refuses
# to promote a database change the ref does not cover. That is the whole point
# of the separation: an attestation typed into the promotion run proves nothing
# about what staging ever had on it, whereas this can only ever sign off the
# commit staging actually deployed, and only after the deploy succeeded.
#
# There is deliberately no ref input. The commit is read from `staging-target`,
# which deploy-staging.yml moves only on a successful deploy.

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Exact staging deployment ID that you exercised (from Deploy to staging)
        required: true
      result:
        description: Did staging pass?
        required: true
        type: choice
        options:
          - pass
          - fail
        default: pass
      exercised:
        description: What was exercised on staging, in enough detail to argue with
        required: true

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - name: Read what staging is running
        id: staging
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha="$(
            gh api "repos/${REPO}/git/ref/heads/staging-target" --jq .object.sha 2>/dev/null || true
          )"
          if [ -z "$sha" ]; then
            echo "::error::Nothing has been deployed to staging yet, so there is nothing to check."
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Staging is running ${sha}"

      - name: Bind the check to the deployment that was exercised
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.staging.outputs.sha }}
          EXPECTED_DEPLOYMENT: ${{ inputs.deployment_id }}
        run: |
          record="$(node .github/scripts/release-record.mjs staged "$SHA")"
          [ "$(jq -r .deployment_id <<<"$record")" = "$EXPECTED_DEPLOYMENT" ] || \
            { echo 'Staging changed since this deployment was exercised'; exit 1; }

      # A sign-off nobody can read later is not a record. The floor is low on
      # purpose: it rejects "ok", not brevity.
      - name: Require a usable description
        env:
          EXERCISED: ${{ inputs.exercised }}
        run: |
          set -euo pipefail
          trimmed="$(printf '%s' "$EXERCISED" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')"
          if [ "${#trimmed}" -lt 20 ]; then
            echo "::error::Say what was exercised on staging. '${trimmed}' does not tell the next person anything."
            exit 1
          fi
          case "$(printf '%s' "$trimmed" | tr '[:upper:]' '[:lower:]')" in
            'it works'*|'looks good'*|'lgtm'*|'tested it'*|'all good'*)
              echo "::error::Name the paths, records, or commands you exercised, not the verdict."
              exit 1
              ;;
          esac

      - name: Record the check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.staging.outputs.sha }}
          IMAGE: ${{ steps.artifact.outputs.image }}
          DEPLOYMENT_ID: ${{ steps.artifact.outputs.deployment_id }}
          RESULT: ${{ inputs.result }}
          EXERCISED: ${{ inputs.exercised }}
          RELEASE_ENVIRONMENT: staging-check
        run: |
          export RELEASE_RESULT=success
          [ "$RESULT" = pass ] || export RELEASE_RESULT=failure
          export RELEASE_PAYLOAD="$(jq -nc --arg sha "$SHA" --arg image "$IMAGE" \
            --argjson deployment_id "$DEPLOYMENT_ID" --arg staging_check "$RESULT" \
            --arg exercised "$EXERCISED" \
            '{kind:"staging-check",sha:$sha,image:$image,deployment_id:$deployment_id,staging_check:$staging_check,exercised:$exercised}')"
          node .github/scripts/release-record.mjs publish "$SHA"

      # Only a pass moves the ref. A failed check leaves the previous sign-off
      # standing, which is correct: that commit really was checked, and the
      # containment test in deploy-production.yml is what then refuses to
      # promote the newer database change on top of it.
      - name: Mark the commit as checked
        if: inputs.result == 'pass'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.staging.outputs.sha }}
        run: |
          set -euo pipefail
          if gh api "repos/${REPO}/git/ref/heads/staging-verified" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPO}/git/refs/heads/staging-verified" \
              -f sha="$SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref=refs/heads/staging-verified -f sha="$SHA" >/dev/null
          fi
          echo "staging-verified now points at ${SHA}"

      - name: Say so where the release is being watched
        if: always()
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.staging.outputs.sha }}
          RESULT: ${{ inputs.result }}
          EXERCISED: ${{ inputs.exercised }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "SLACK_DEPLOY_WEBHOOK is not set; skipping the announcement."
            exit 0
          fi
          text="$(printf 'Staging check %s: %s at %s, checked by %s\n%s' \
            "$RESULT" "$REPO" "${SHA:0:7}" "$ACTOR" "$EXERCISED")"
          jq -nc --arg text "$text" '{text: $text}' \
            | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK"
