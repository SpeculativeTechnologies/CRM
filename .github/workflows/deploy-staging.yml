name: Deploy to staging

# Deploys a commit to cloud staging without anyone needing an interactive shell.
#
# This workflow validates the target and image, dispatches cd-deploy-cloud,
# waits for the cloud deployment result, and only then moves `staging-target` as
# a record of what the environment successfully ran.
#
# Two checks below are load-bearing. The commit must exist in this repository
# and an image must already be published for it. Together they mean staging
# can only ever run code that CI built, so this cannot become a way to run
# arbitrary code next to production.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to put on staging
        required: true
        default: main

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  point-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      packages: read
      actions: read # to read the cd-deploy-cloud run this waits on
    steps:
      # Only for .github/actions/deploy-cloud-box; nothing here builds anything.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve ref to a commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          # Fails when the ref does not exist here, which is also what stops an
          # arbitrary commit from being staged.
          sha="$(gh api "repos/${REPO}/commits/${REF}" --jq .sha)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${REF} to ${sha}"

      - name: Require a tested immutable artifact and exact-commit CI
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: node .github/scripts/release-record.mjs artifact "$SHA"

      - name: Deploy the cloud box
        uses: ./.github/actions/deploy-cloud-box
        with:
          environment: staging
          sha: ${{ steps.resolve.outputs.sha }}
          image: ${{ steps.artifact.outputs.image }}
          token: ${{ github.token }}

      # Nothing deploys from this ref any more; the Mac that polled it is retired.
      # It stays because deploy-production.yml reads it to refuse promoting code
      # staging never ran. That makes it a claim about what staging has actually
      # had on it, so it is only safe to move once the deploy above succeeded --
      # moving it first would let a failed staging deploy clear the way to
      # production.
      - name: Record what staging now runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          if gh api "repos/${REPO}/git/ref/heads/staging-target" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPO}/git/refs/heads/staging-target" \
              -f sha="$SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref=refs/heads/staging-target -f sha="$SHA" >/dev/null
          fi
          echo "staging-target now points at ${SHA}"
