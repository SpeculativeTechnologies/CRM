name: Deploy to production

# Promotes a commit to cloud production without anyone needing an interactive
# shell on the host.
#
# Unlike staging, this is deliberately not frictionless. It declares the
# `production` environment, so if that environment has required reviewers
# configured, this run parks until a human approves it. Remote, not automatic.
#
# WARNING: the gate lives in the environment's protection rules, not in this
# file. Without required reviewers configured on the `production` environment,
# this workflow will deploy with no approval step at all. See PRODUCTION.md.
#
# The workflow encodes the promotion rules that were previously only written
# down:
#   - the commit must already be merged into main
#   - staging must have run something this commit contains
#   - anything reaching the database must be inside a commit somebody signed
#     off with Record a staging check
#   - cd-deploy-cloud verifies the pinned image before touching the VM

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA to promote (must be merged into main)
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      deployments: write
      actions: read # to read the cd-deploy-cloud run this waits on
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate the commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          sha="$(gh api "repos/${REPO}/commits/${REF}" --jq .sha)"

          # Production only ever runs reviewed code that is already on main.
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::${sha} is not merged into main."
            exit 1
          fi

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${REF} to ${sha}"

      - name: Require that staging ran this code
        id: staged
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          staged="$(
            gh api "repos/${REPO}/git/ref/heads/staging-target" --jq .object.sha 2>/dev/null || true
          )"
          if [ -z "$staged" ]; then
            echo "::error::Nothing has been deployed to staging yet."
            exit 1
          fi

          # What staging exercised has to be contained in what is being
          # promoted. Requiring equality would fail as soon as the branch was
          # merged, since the merge commit differs from the branch head.
          if ! git merge-base --is-ancestor "$staged" "$SHA"; then
            echo "::error::Staging last ran ${staged}, which ${SHA} does not contain."
            echo "Deploy this commit to staging and exercise it before promoting."
            exit 1
          fi
          # Read by the database gate below to tell someone who has already put
          # this commit on staging that they do not need to deploy it again.
          echo "sha=${staged}" >> "$GITHUB_OUTPUT"
          echo "Staging ran ${staged}, contained in ${SHA}"

      # The step above is satisfied by staging having run an ancestor, which is
      # right for reversible code and wrong for a migration: merge a command on
      # top of a staged commit and it would ride to production having never run
      # anywhere. So database changes are held to the stricter test. They must
      # be contained in the commit somebody signed off with Record a staging
      # check, which can only ever name a commit staging deployed successfully.
      - name: Require a staging check for database changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.sha }}
          STAGED: ${{ steps.staged.outputs.sha }}
        run: |
          set -euo pipefail
          # The promotion refs are ordinary branches, so fetch-depth 0 has them,
          # but be explicit rather than depend on that.
          git fetch --no-tags --quiet origin '+refs/heads/*:refs/remotes/origin/*'

          # Every way this can fail says the same two things: why production
          # will not take a database change on a redeploy's word, and what to
          # do next. The next step differs by whether staging is already
          # running this commit -- telling someone who staged it an hour ago to
          # stage it again is how a gate gets read as a malfunction.
          explain() {
            echo
            echo "Why: a rollback redeploys the previous image. It does not un-run a"
            echo "migration or restore rows a data command changed, so production takes"
            echo "database changes only once somebody has exercised them on staging and"
            echo "recorded what they exercised."
            echo
            echo "What to do:"
            if [ "$STAGED" = "$SHA" ]; then
              echo "  Staging is already running this commit, so it does not need deploying again."
              echo "  1. Exercise the change at https://crm-staging.spec.tech, if you have not already"
              echo "  2. Run the 'Record a staging check' workflow and say what you exercised"
              echo "  3. Run this workflow again for ${SHA}"
            else
              echo "  1. Run 'Deploy to staging' for ${SHA}"
              echo "  2. Exercise the change at https://crm-staging.spec.tech"
              echo "  3. Run the 'Record a staging check' workflow and say what you exercised"
              echo "  4. Run this workflow again for ${SHA}"
            fi
            echo
            echo "Background: deploy/TEAM-WORKFLOW.md, 'Database changes'."
          }

          running="$(
            gh api "repos/${REPO}/git/ref/heads/production-target" --jq .object.sha 2>/dev/null || true
          )"

          # Without a previous production deploy there is no baseline to say
          # what this promotion introduces, so it is held to the check.
          if [ -n "$running" ]; then
            introduced="$(node .github/scripts/database-changes.mjs "$running" "$SHA")"
            if [ -z "$introduced" ]; then
              echo "Nothing in this promotion reaches the database."
              exit 0
            fi
          else
            echo "No recorded production deploy to compare against; requiring a staging check."
          fi

          verified="$(
            gh api "repos/${REPO}/git/ref/heads/staging-verified" --jq .object.sha 2>/dev/null || true
          )"
          if [ -z "$verified" ]; then
            echo "::error::${SHA:0:7} changes the database and no staging check has been recorded for it."
            if [ -n "${introduced:-}" ]; then
              echo "These reach the database:"
              sed 's/^/  /' <<<"$introduced"
            fi
            explain
            exit 1
          fi

          if ! git merge-base --is-ancestor "$verified" "$SHA"; then
            echo "::error::${SHA:0:7} changes the database, and the last staging check was for ${verified:0:7}, which is not in its history."
            explain
            exit 1
          fi

          # Everything reaching the database has to be inside what was checked.
          # An empty diff from the checked commit forward is the proof.
          unchecked="$(node .github/scripts/database-changes.mjs "$verified" "$SHA")"
          if [ -n "$unchecked" ]; then
            echo "::error::${SHA:0:7} changes the database in ways the staging check of ${verified:0:7} did not cover."
            echo "These landed after that check:"
            sed 's/^/  /' <<<"$unchecked"
            explain
            exit 1
          fi

          echo "The database changes in ${SHA} are covered by the staging check of ${verified}."

      # Already past the environment gate above, so the single approval that
      # guards promotion also guards this. cd-deploy-cloud deliberately declares
      # no environment for a repository_dispatch, or it would ask for a second.
      - name: Deploy the cloud box
        uses: ./.github/actions/deploy-cloud-box
        with:
          environment: production
          sha: ${{ steps.resolve.outputs.sha }}
          token: ${{ github.token }}

      # As with staging-target: a record of what production runs, not the thing
      # that puts it there, and written only once the deploy above succeeded so a
      # rolled-back deploy does not leave the ref claiming otherwise.
      - name: Record what production now runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          if gh api "repos/${REPO}/git/ref/heads/production-target" >/dev/null 2>&1; then
            gh api --method PATCH "repos/${REPO}/git/refs/heads/production-target" \
              -f sha="$SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/${REPO}/git/refs" \
              -f ref=refs/heads/production-target -f sha="$SHA" >/dev/null
          fi
          echo "production-target now points at ${SHA}"

      - name: Record the deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          # See deploy-staging.yml for why `ref` is the SHA and not a branch.
          # Production only ever promotes a commit already on main, so the
          # branch is fixed; what the record was missing is which commit and
          # who approved it, in a form readable without opening the API.
          description="$(printf 'main @ %s, approved by %s' \
            "${SHA:0:7}" "$ACTOR" | cut -c1-140)"
          body="$(jq -nc \
            --arg sha "$SHA" \
            --arg description "$description" \
            --arg actor "$ACTOR" \
            '{
              ref: $sha,
              environment: "production",
              description: $description,
              payload: {
                requested_ref: "main",
                sha: $sha,
                approved_by: $actor
              },
              auto_merge: false,
              required_contexts: []
            }')"
          id="$(gh api --method POST "repos/${REPO}/deployments" --jq .id --input - <<<"$body")"
          gh api --method POST "repos/${REPO}/deployments/${id}/statuses" \
            -f state=success \
            -f description="deployed and verified on cloud production" >/dev/null
          echo "Deployment ${id} recorded for ${SHA}"

      # So that promotion can be delegated without the production owner having
      # to be the approval gate to hear about it. Silently does nothing until
      # SLACK_DEPLOY_WEBHOOK is set, and never fails the deploy: a release that
      # worked must not be reported as broken because a webhook was down.
      - name: Announce the release
        if: always()
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.SLACK_DEPLOY_WEBHOOK }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.resolve.outputs.sha }}
          ACTOR: ${{ github.actor }}
          OUTCOME: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${WEBHOOK:-}" ]; then
            echo "SLACK_DEPLOY_WEBHOOK is not set; skipping the announcement."
            exit 0
          fi
          text="$(printf 'Production deploy %s: %s at %s, run by %s\n%s' \
            "$OUTCOME" "$REPO" "${SHA:0:7}" "$ACTOR" "$RUN_URL")"
          jq -nc --arg text "$text" '{text: $text}' \
            | curl -sS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK"
