# Deploy a pinned image to the cloud staging or production box.
#
# Authenticates to Google Cloud with Workload Identity Federation, so no service
# account key exists anywhere. Every environment-specific identifier comes from
# repository variables rather than being written here, because this repository is
# public.
#
# This is the only thing that deploys a cloud box. deploy-staging.yml and
# deploy-production.yml decide what may go out and then wait on a run of this.
#
# It used to also trigger on pushes to the staging-target and production-target
# branches, which is how the Mac's pollers were fed during the parallel run. That
# trigger never once fired: those refs are moved with GITHUB_TOKEN, and GitHub
# suppresses push events from that token. Now that the Mac is retired the refs are
# only a record of what each environment runs, so the trigger is gone rather than
# left looking load-bearing.
#
# Promotion is gated upstream: deploy-production.yml requires a reviewer before it
# dispatches. Gating again here would mean approving every deploy twice, so the
# environment is declared only for manual dispatch, where no upstream approval has
# happened.
name: cd-deploy-cloud

# The correlation id is how the workflow that dispatched this one finds it again,
# since the dispatch API returns nothing to identify the run it created. It is
# empty for a manual dispatch, which nobody is waiting on.
run-name: >-
  cd-deploy-cloud
  ${{ github.event.inputs.environment || github.event.client_payload.environment }}
  ${{ github.event.client_payload.correlation_id }}

on:
  # What deploy-staging.yml and deploy-production.yml send, then wait for.
  # repository_dispatch is one of the two events GitHub always delivers even from
  # GITHUB_TOKEN. It also leaves `environment` empty below, so production keeps
  # the single approval it already took upstream rather than asking twice.
  repository_dispatch:
    types: [deploy-cloud]
  workflow_dispatch:
    inputs:
      environment:
        description: Which box to deploy
        required: true
        type: choice
        options: [staging, production]
      image:
        description: Tested immutable GHCR image reference, including digest
        required: true
        type: string
      sha:
        description: 40-character commit SHA to deploy (defaults to this ref)
        required: false
        type: string

permissions:
  contents: read
  id-token: write # required to mint the OIDC token for federation
  deployments: write
  packages: read # GITHUB_TOKEN cannot read a private GHCR package without this

concurrency:
  # Never let two deploys race on the same box.
  group: cd-deploy-cloud-${{ github.event.inputs.environment || github.event.client_payload.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Empty for push-triggered runs: the approval already happened in
    # deploy-production.yml before production-target moved.
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve target
        id: target
        env:
          REQUESTED_ENVIRONMENT: ${{ github.event.inputs.environment || github.event.client_payload.environment }}
          REQUESTED_SHA: ${{ github.event.inputs.sha || github.event.client_payload.sha }}
          REQUESTED_IMAGE: ${{ github.event.inputs.image || github.event.client_payload.image }}
        run: |
          set -euo pipefail
          ENV_NAME="$REQUESTED_ENVIRONMENT"
          SHA="$REQUESTED_SHA"
          [[ "$REQUESTED_IMAGE" =~ ^ghcr.io/[a-z0-9/-]+@sha256:[0-9a-f]{64}$ ]] || { echo 'Immutable image required'; exit 1; }
          echo "image=$REQUESTED_IMAGE" >> "$GITHUB_OUTPUT"
          case "$ENV_NAME" in
            staging | production) ;;
            *) echo "not a known environment: '$ENV_NAME'"; exit 1 ;;
          esac
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "not a 40-char sha: $SHA"; exit 1; }
          # Each box carries its own zone. They have always been co-located, but a
          # zone that runs out of capacity for a machine family is a real event, and
          # recovering from it can mean rebuilding one box somewhere else. A single
          # shared zone would then break deploys to the box that did not move.
          # GCP_ZONE stays the fallback so neither environment needs its own
          # variable set until it actually diverges.
          if [ "$ENV_NAME" = "production" ]; then
            echo "vm=${{ vars.GCP_PRODUCTION_VM }}" >> "$GITHUB_OUTPUT"
            ZONE="${{ vars.GCP_PRODUCTION_ZONE || vars.GCP_ZONE }}"
          else
            echo "vm=${{ vars.GCP_STAGING_VM }}" >> "$GITHUB_OUTPUT"
            ZONE="${{ vars.GCP_STAGING_ZONE || vars.GCP_ZONE }}"
          fi
          [ -n "$ZONE" ] || { echo "no zone configured for $ENV_NAME"; exit 1; }
          echo "zone=$ZONE"
          echo "zone=$ZONE" >> "$GITHUB_OUTPUT"
          echo "env_name=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Recheck promotion identity before touching the box
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          IMAGE: ${{ steps.target.outputs.image }}
          ENVIRONMENT: ${{ steps.target.outputs.env_name }}
        run: |
          mode=artifact
          if [ "$ENVIRONMENT" = production ]; then
            git merge-base --is-ancestor "$SHA" origin/main
            mode=promote
          fi
          record="$(node .github/scripts/release-record.mjs "$mode" "$SHA")"
          [ "$(jq -r .image <<<"$record")" = "$IMAGE" ] || { echo 'Artifact changed'; exit 1; }

      - name: Record the deployment attempt
        id: attempt
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          IMAGE: ${{ steps.target.outputs.image }}
          RELEASE_ENVIRONMENT: ${{ steps.target.outputs.env_name }}
          RELEASE_RESULT: pending
        run: |
          kind=staged-artifact
          [ "$RELEASE_ENVIRONMENT" != production ] || kind=production-artifact
          export RELEASE_PAYLOAD="$(jq -nc --arg sha "$SHA" --arg image "$IMAGE" --arg kind "$kind" \
            '{kind:$kind,sha:$sha,image:$image}')"
          node .github/scripts/release-record.mjs publish "$SHA"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Start the box if it is stopped
        run: |
          set -euo pipefail
          VM="${{ steps.target.outputs.vm }}"
          ZONE="${{ steps.target.outputs.zone }}"
          # GCP refuses `instances start` while a box is still STOPPING, and a
          # deploy fired moments after someone stopped staging lands exactly
          # there. Wait for a settled state before deciding what to do.
          STATUS=$(gcloud compute instances describe "$VM" --zone "$ZONE" --format='value(status)')
          for i in $(seq 1 30); do
            case "$STATUS" in
              RUNNING|TERMINATED|SUSPENDED) break ;;
            esac
            echo "$VM is $STATUS; waiting for a settled state ($i/30)"
            sleep 10
            STATUS=$(gcloud compute instances describe "$VM" --zone "$ZONE" --format='value(status)')
          done
          echo "$VM is $STATUS"
          if [ "$STATUS" != "RUNNING" ]; then
            gcloud compute instances start "$VM" --zone "$ZONE"
            # Containers return on their own (restart: unless-stopped); wait for
            # SSH rather than guessing at a sleep duration.
            for i in $(seq 1 30); do
              if gcloud compute ssh "$VM" --zone "$ZONE" --tunnel-through-iap --quiet \
                   --command='true' 2>/dev/null; then echo "reachable"; break; fi
              echo "waiting for ssh ($i/30)"; sleep 10
            done
          fi

      # Fork: the box's own data decides whether an upgrade works, not CI. The
      # dry run from the target image lists every step it would run, including
      # commands caught up from behind the cursor, and fails on the errors that
      # cost six deploys on 2026-09-03/04. Read its output in the step summary.
      - name: Require digest-aware host deploy contract
        run: |
          gcloud compute ssh "${{ steps.target.outputs.vm }}" \
            --zone "${{ steps.target.outputs.zone }}" --tunnel-through-iap --quiet \
            --command 'sudo grep -qx "# RELEASE_ARTIFACT_CONTRACT=1" /opt/twenty/cloud-deploy.sh'

      - name: Rehearse the upgrade against the box
        run: |
          set -euo pipefail
          REHEARSAL=$(mktemp)
          gcloud compute ssh "${{ steps.target.outputs.vm }}" \
            --zone "${{ steps.target.outputs.zone }}" --tunnel-through-iap --quiet \
            --command "sudo IMAGE_SHA=${{ steps.target.outputs.sha }} IMAGE_REF=${{ steps.target.outputs.image }} bash -s" \
            < deploy/cloud-rehearse.sh | tee "$REHEARSAL"
          {
            echo "## Upgrade rehearsal (${{ steps.target.outputs.env_name }}, ${{ steps.target.outputs.sha }})"
            echo
            echo '```'
            grep -E '^\[rehearse\]|DRY RUN|catch-up|ERROR' "$REHEARSAL" | sed 's/.*\(LOG \|WARN \|ERROR \)//' | cut -c1-200 | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy
        run: |
          set -euo pipefail
          gcloud compute ssh "${{ steps.target.outputs.vm }}" \
            --zone "${{ steps.target.outputs.zone }}" --tunnel-through-iap --quiet \
            --command "sudo /opt/twenty/cloud-deploy.sh ${{ steps.target.outputs.sha }} ${{ steps.target.outputs.image }}"
      # Fork: a green health check is not a working CRM. These are the invariants
      # that were false while healthz answered ok this week. The image is already
      # live when this runs; a failure here fails the run so the promotion that
      # caused it is refused, and says exactly what to look at.
      - name: Verify the box
        run: |
          set -euo pipefail
          VERIFY=$(mktemp)
          set +e
          gcloud compute ssh "${{ steps.target.outputs.vm }}" \
            --zone "${{ steps.target.outputs.zone }}" --tunnel-through-iap --quiet \
            --command "sudo EXPECTED_SHA=${{ steps.target.outputs.sha }} EXPECTED_IMAGE=${{ steps.target.outputs.image }} bash -s" \
            < deploy/cloud-verify.sh | tee "$VERIFY"
          STATUS=${PIPESTATUS[0]}
          set -e
          {
            echo "## Box verification (${{ steps.target.outputs.env_name }})"
            echo
            echo '```'
            grep '^\[verify\]' "$VERIFY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"

      - name: Verify from outside
        run: |
          set -euo pipefail
          HOST="${{ steps.target.outputs.env_name == 'production' && vars.API_HOSTNAME_PRODUCTION || vars.API_HOSTNAME_STAGING }}"
          # The API hostname is service-token gated, so an unauthenticated probe
          # proving 403 confirms the tunnel is up AND the edge policy is intact.
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' "https://$HOST/healthz" --max-time 30)
          echo "$HOST unauthenticated -> $CODE"
          [ "$CODE" = "403" ] || { echo "expected 403 from Access"; exit 1; }

      - name: Record deployment outcome
        if: always() && steps.attempt.outputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.target.outputs.sha }}
          RELEASE_DEPLOYMENT_ID: ${{ steps.attempt.outputs.deployment_id }}
          RELEASE_RESULT: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: node .github/scripts/release-record.mjs finish "$SHA"

      - name: Stop staging again when idle
        # Production stays up. Staging costs far more running than stopped, so a
        # deploy that wakes it should put it back. Left off by default while a
        # us-central1 capacity shortage makes any start a gamble: a box that is
        # already up is worth more than the saving.
        if: steps.target.outputs.env_name == 'staging' && vars.STAGING_STOP_AFTER_DEPLOY == 'true'
        run: |
          gcloud compute instances stop "${{ steps.target.outputs.vm }}" \
            --zone "${{ steps.target.outputs.zone }}" --async
