# Development infrastructure services only (Postgres + Redis).
# Use this when developing locally against the source code.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down       # stop
#   docker compose -f docker-compose.dev.yml down -v    # stop + wipe data

name: twenty-dev

services:
  db:
    image: postgres:16
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: default
    command: ["postgres", "-c", "wal_level=logical"]
    healthcheck:
      test: pg_isready -U postgres -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Local-first sync spike (packages/twenty-front local-first work): streams
  # workspace schema changes off Postgres logical replication. Not part of
  # the standard dev stack yet -- only started via the `local-first` profile.
  electric:
    image: electricsql/electric:latest
    profiles: ["local-first"]
    ports:
      - "3010:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/default
      ELECTRIC_INSECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dev-db-data:
